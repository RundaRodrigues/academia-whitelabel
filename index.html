<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia — modelo white label</title>
<meta name="description" content="Modelo de site white label para academias e estúdios de treino.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<a class="skip-link" href="#main" data-b="ui.pularConteudo">Pular para o conteúdo</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-dumbbell" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"/></g>
    <g id="i-shower" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M12 12a8 8 0 0 0-8-8V3M8 16v.01M12 16v.01M16 16v.01M10 19v.01M14 19v.01"/></g>
    <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g id="i-car" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M4 17v2m16-2v2M3 13l1.6-4.6A2 2 0 0 1 6.5 7h11a2 2 0 0 1 1.9 1.4L21 13v4H3Z"/><circle cx="7" cy="14.5" r="1"/><circle cx="17" cy="14.5" r="1"/></g>
    <g id="i-heart" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1l8.8 8.8 8.8-8.8a5 5 0 0 0 0-7.1Z"/></g>
    <g id="i-phone" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></g>
    <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g>
    <g id="i-mail" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></g>
    <g id="i-wa" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.3 5.2 4.6.7.3 1.3.5 1.8.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2Z"/></g>
  </defs>
</svg>

<header class="header" data-header>
  <div class="wrap">
    <a class="logo" href="#top">
      <span class="logo-mark" data-b="sigla" translate="no">FG</span>
      <span data-b="nome" translate="no">Forja Gym</span>
    </a>

    <nav class="nav" id="nav-menu" data-nav-menu aria-label="Navegação principal">
      <a href="#modalidades" data-b="nav.modalidades">Modalidades</a>
      <a href="#planos" data-b="nav.planos">Planos</a>
      <a href="#grade" data-b="nav.grade">Grade de aulas</a>
      <a href="#equipe" data-b="nav.equipe">Professores</a>
      <a href="#faq" data-b="nav.faq">Dúvidas</a>
      <a class="btn btn-primary" data-battr="href:_links.whatsapp" target="_blank" rel="noopener" data-b="nav.cta">Aula grátis</a>
    </nav>

    <div class="header-cta">
      <a class="btn btn-primary" data-battr="href:_links.whatsapp" target="_blank" rel="noopener" data-b="nav.cta">Aula grátis</a>
      <button class="nav-toggle" data-nav-toggle aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main">

<!-- ============ HERO ============ -->
<section class="hero" id="top">
  <div class="hero-bg"><img src="assets/hero-wide.svg" alt="" width="1600" height="900" fetchpriority="high"></div>
  <div class="wrap">
    <span class="eyebrow" data-b="hero.eyebrow"></span>
    <h1 data-bhtml="hero.tituloHtml"></h1>
    <p class="lead" data-b="hero.subtitulo"></p>

    <div class="hero-actions">
      <a class="btn btn-primary btn-lg" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18"><use href="#i-wa"/></svg>
        <span data-b="hero.ctaPrimario"></span>
      </a>
      <a class="btn btn-ghost btn-lg" href="#planos" data-b="hero.ctaSecundario"></a>
    </div>

    <div class="hero-nums" data-list="hero.numeros">
      <template><div class="hero-num"><strong>{{valor}}</strong><span>{{label}}</span></div></template>
    </div>
  </div>
</section>

<!-- ============ MODALIDADES ============ -->
<section class="section" id="modalidades">
  <div class="wrap">
    <div class="head-row">
      <div class="section-head wide" data-reveal>
        <span class="eyebrow" data-b="modalidades.eyebrow"></span>
        <h2 data-b="modalidades.titulo"></h2>
        <p class="lead" data-b="modalidades.subtitulo"></p>
      </div>
      <a class="btn btn-ghost" href="#grade" data-b="modalidades.cta"></a>
    </div>

    <div class="grid grid-3" data-list="modalidades.itens">
      <template>
        <article class="mod-card" data-reveal data-delay="{{@index}}">
          <img src="{{foto}}" alt="{{nome}}" loading="lazy" width="800" height="1000">
          <span class="mod-tag">{{tag}}</span>
          <div class="mod-body">
            <h3>{{nome}}</h3>
            <p>{{texto}}</p>
          </div>
        </article>
      </template>
    </div>
  </div>
</section>

<!-- ============ PLANOS ============ -->
<section class="section" id="planos" style="background:var(--surface)">
  <div class="wrap">
    <div class="section-head center" data-reveal>
      <span class="eyebrow" data-b="planos.eyebrow"></span>
      <h2 data-b="planos.titulo"></h2>
      <p class="lead" data-b="planos.subtitulo"></p>
    </div>

    <div class="plans" data-list="planos.itens">
      <template>
        <article class="plan-card {{classe}}" data-reveal data-delay="{{@index}}">
          <span class="plan-flag">{{flag}}</span>
          <h3>{{nome}}</h3>
          <p class="plan-price">{{preco}} <small>{{periodo}}</small></p>
          <p class="plan-note">{{detalhe}}</p>
          <ul>
            <li>{{beneficios.0}}</li><li>{{beneficios.1}}</li><li>{{beneficios.2}}</li>
            <li>{{beneficios.3}}</li><li>{{beneficios.4}}</li>
          </ul>
          <a class="btn btn-primary btn-block" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">{{cta}}</a>
        </article>
      </template>
    </div>

    <p class="form-note center" style="margin-top:20px" data-b="planos.nota" data-reveal></p>
  </div>
</section>

<!-- ============ GRADE DE AULAS ============ -->
<section class="section" id="grade">
  <div class="wrap">
    <div class="section-head wide" data-reveal>
      <span class="eyebrow" data-b="grade.eyebrow"></span>
      <h2 data-b="grade.titulo"></h2>
      <p class="lead" data-b="grade.subtitulo"></p>
    </div>

    <div class="grade-wrap" data-reveal>
      <div class="grade-scroll" tabindex="0" role="region" aria-label="Grade semanal de aulas">
        <table class="grade">
          <thead>
            <tr data-list="grade.colunas">
              <template><th scope="col">{{.}}</th></template>
            </tr>
          </thead>
          <tbody data-list="grade.linhas">
            <template>
              <tr>
                <th scope="row">{{hora}}</th>
                <td><span class="aula">{{aulas.0.a}}</span><span class="sala">{{aulas.0.s}}</span></td>
                <td><span class="aula">{{aulas.1.a}}</span><span class="sala">{{aulas.1.s}}</span></td>
                <td><span class="aula">{{aulas.2.a}}</span><span class="sala">{{aulas.2.s}}</span></td>
                <td><span class="aula">{{aulas.3.a}}</span><span class="sala">{{aulas.3.s}}</span></td>
                <td><span class="aula">{{aulas.4.a}}</span><span class="sala">{{aulas.4.s}}</span></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <p class="grade-nota" data-b="grade.nota"></p>
    </div>
  </div>
</section>

<!-- ============ ESTRUTURA ============ -->
<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="section-head wide" data-reveal>
      <span class="eyebrow" data-b="estrutura.eyebrow"></span>
      <h2 data-b="estrutura.titulo"></h2>
    </div>
    <div class="grid grid-3" data-list="estrutura.itens">
      <template>
        <div class="feat-item" data-reveal data-delay="{{@index}}">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-{{icone}}"/></svg></span>
          <h3>{{titulo}}</h3>
          <p>{{texto}}</p>
        </div>
      </template>
    </div>
  </div>
</section>

<!-- ============ NÚMEROS ============ -->
<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="stats" data-list="numeros" data-reveal>
      <template><div class="stat"><strong>{{valor}}</strong><span>{{label}}</span></div></template>
    </div>
  </div>
</section>

<!-- ============ PROFESSORES ============ -->
<section class="section" id="equipe" style="background:var(--surface)">
  <div class="wrap">
    <div class="section-head wide" data-reveal>
      <span class="eyebrow" data-b="equipe.eyebrow"></span>
      <h2 data-b="equipe.titulo"></h2>
      <p class="lead" data-b="equipe.subtitulo"></p>
    </div>
    <div class="grid grid-4 grid-tight-sm" data-list="equipe.itens">
      <template>
        <article class="coach-card" data-reveal data-delay="{{@index}}">
          <span class="shot">
            <img src="{{foto}}" alt="{{nome}}" loading="lazy" width="600" height="800">
            <span class="spec">{{especialidade}}</span>
          </span>
          <h3>{{nome}}</h3>
          <p class="cref">{{registro}}</p>
        </article>
      </template>
    </div>
  </div>
</section>

<!-- ============ DEPOIMENTOS ============ -->
<section class="section" id="depoimentos">
  <div class="wrap">
    <div class="section-head wide" data-reveal>
      <span class="eyebrow" data-b="depoimentos.eyebrow"></span>
      <h2 data-b="depoimentos.titulo"></h2>
    </div>
    <div class="grid grid-3" data-list="depoimentos.itens">
      <template>
        <article class="card quote-card" data-reveal data-delay="{{@index}}">
          <blockquote>&ldquo;{{texto}}&rdquo;</blockquote>
          <footer><span class="avatar">{{inicial}}</span><div><div class="who">{{autor}}</div><div class="pet">{{detalhe}}</div></div></footer>
        </article>
      </template>
    </div>
  </div>
</section>

<!-- ============ FAIXA FINAL ============ -->
<section class="section" style="padding-top:0">
  <div class="wrap">
    <div class="cta-band" data-reveal>
      <h2 data-bhtml="faixaFinal.tituloHtml"></h2>
      <p data-b="faixaFinal.texto"></p>
      <a class="btn btn-primary btn-lg" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" width="18" height="18"><use href="#i-wa"/></svg>
        <span data-b="faixaFinal.cta"></span>
      </a>
    </div>
  </div>
</section>

<!-- ============ DÚVIDAS + HORÁRIOS ============ -->
<section class="section" id="faq">
  <div class="wrap contact-grid">
    <div data-reveal>
      <span class="eyebrow" data-b="faq.eyebrow"></span>
      <h2 style="font-size:var(--fs-h2);font-weight:400;line-height:.94;margin-block:12px 26px" data-b="faq.titulo"></h2>

      <div class="card hours-card">
        <h3 style="font-size:var(--fs-h3);font-weight:650;font-family:var(--font-body);margin-bottom:10px" data-b="horarios.titulo"></h3>
        <div data-list="horarios.itens">
          <template><div class="hours-row"><span>{{dia}}</span><span>{{hora}}</span></div></template>
        </div>
        <p class="form-note" style="margin-top:16px" data-b="horarios.nota"></p>
      </div>
    </div>

    <div data-accordion data-reveal data-delay="1">
      <div data-list="faq.itens">
        <template>
          <div class="faq-item">
            <button class="faq-q" type="button" aria-expanded="false">{{p}}</button>
            <div class="faq-a"><div><p>{{r}}</p></div></div>
          </div>
        </template>
      </div>
    </div>
  </div>
</section>

<!-- ============ MATRÍCULA ============ -->
<section class="section" id="contato" style="background:var(--surface)">
  <div class="wrap contact-grid">
    <div data-reveal>
      <span class="eyebrow" data-b="contatoSecao.eyebrow"></span>
      <h2 style="font-size:var(--fs-h2);font-weight:400;line-height:.94;margin-block:12px 16px" data-b="contatoSecao.titulo"></h2>
      <p class="lead measure" data-b="contatoSecao.subtitulo"></p>

      <div class="contact-list">
        <a class="contact-item" data-battr="href:_links.whatsapp" target="_blank" rel="noopener">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-wa"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.whatsapp"></span><span class="v" data-b="contato.whatsappLabel"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.telefone">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.telefone"></span><span class="v" data-b="contato.telefoneLabel"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.mapa" target="_blank" rel="noopener">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-pin"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.endereco"></span><span class="v" data-b="contato.endereco"></span></span>
        </a>
        <a class="contact-item" data-battr="href:_links.email">
          <span class="icon-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg></span>
          <span><span class="k" data-b="contatoSecao.chaves.email"></span><span class="v" data-b="contato.email"></span></span>
        </a>
      </div>
    </div>

    <form class="contact-form" data-form data-reveal data-delay="1" novalidate>
      <div class="form-rows">
        <div class="row-2">
          <div class="field">
            <label for="f-nome" data-b="contatoSecao.form.nome"></label>
            <input id="f-nome" name="Nome" type="text" data-battr="placeholder:contatoSecao.form.nomeHint"
                   autocomplete="name" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="f-tel" data-b="contatoSecao.form.whats"></label>
            <input id="f-tel" name="WhatsApp" type="tel" data-battr="placeholder:contatoSecao.form.whatsHint"
                   autocomplete="tel" inputmode="tel" spellcheck="false" required>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="f-obj" data-b="contatoSecao.form.objetivo"></label>
            <select id="f-obj" name="Objetivo" autocomplete="off" data-list-options="contatoSecao.form.objetivos"></select>
          </div>
          <div class="field">
            <label for="f-mod" data-b="contatoSecao.form.modalidade"></label>
            <select id="f-mod" name="Modalidade" autocomplete="off" data-list-options="contatoSecao.form.modalidades"></select>
          </div>
        </div>
        <div class="field">
          <label for="f-turno" data-b="contatoSecao.form.turno"></label>
          <select id="f-turno" name="Turno" autocomplete="off" data-list-options="contatoSecao.form.turnos"></select>
        </div>
        <div class="field">
          <label for="f-msg" data-b="contatoSecao.form.mensagem"></label>
          <textarea id="f-msg" name="Mensagem" data-battr="placeholder:contatoSecao.form.mensagemHint" autocomplete="off"></textarea>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" data-b="contatoSecao.form.enviar"></button>
        <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        <p class="form-note" data-b="contatoSecao.form.nota"></p>
      </div>
    </form>
  </div>
</section>

</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-grid">
      <div>
        <span class="logo" style="color:var(--footer-fg)">
          <span class="logo-mark" data-b="sigla" translate="no"></span>
          <span data-b="nome" translate="no"></span>
        </span>
        <p style="margin-top:16px;max-width:38ch;opacity:.75;font-size:15px" data-b="rodape.sobre"></p>
      </div>
      <div>
        <h4 data-b="rodape.colTreino"></h4>
        <div class="footer-links">
          <a href="#modalidades" data-b="nav.modalidades"></a>
          <a href="#grade" data-b="nav.grade"></a>
          <a href="#planos" data-b="nav.planos"></a>
        </div>
      </div>
      <div>
        <h4 data-b="rodape.colAcademia"></h4>
        <div class="footer-links">
          <a href="#equipe" data-b="nav.equipe"></a>
          <a href="#depoimentos" data-b="depoimentos.eyebrow"></a>
          <a href="#faq" data-b="nav.faq"></a>
        </div>
      </div>
      <div>
        <h4 data-b="rodape.colOnde"></h4>
        <div class="footer-links">
          <a data-battr="href:_links.whatsapp" target="_blank" rel="noopener" data-b="contato.whatsappLabel"></a>
          <a data-battr="href:_links.mapa" target="_blank" rel="noopener" data-b="contato.enderecoCurto"></a>
        </div>
        <div class="footer-links" style="margin-top:14px" data-list="redes">
          <template><a href="{{url}}" target="_blank" rel="noopener">{{nome}}</a></template>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; <span data-year></span> <span data-b="nome" translate="no"></span>. <span data-b="rodape.direitos"></span></span>
      <span data-b="rodape.aviso"></span>
    </div>
  </div>
</footer>

<a class="wa-float" data-battr="href:_links.whatsapp, aria-label:nav.cta" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-wa"/></svg>
</a>

<script src="js/brand.js"></script>
<script src="js/app.js"></script>
</body>
</html>
